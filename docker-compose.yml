services:
  db:
    image: postgres:17-alpine
    container_name: core-payments-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: core_payments
    ports:
      - "5432:5432"
    volumes:
      - core_payments_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  core_payments_pgdata:
